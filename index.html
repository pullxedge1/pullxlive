<title>PullXEdge – Live Cricket</title>
<style>
:root { --bg:#070b14; --card:rgba(255,255,255,.04); --line:rgba(255,255,255,.09); --text:#e8eefc; --mute:#8a96b3; --a:#22d3ee; --b:#8b5cf6; --tg:#229ED9; --live:#ef4444; }
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body { font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif; background:radial-gradient(900px 500px at 10% -10%,rgba(139,92,246,.22),transparent 60%),radial-gradient(800px 500px at 100% 0%,rgba(34,211,238,.16),transparent 60%),var(--bg); color:var(--text); min-height:100vh; padding-bottom:env(safe-area-inset-bottom,0px); }
.top-header { position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px; background:rgba(7,11,20,.75); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid var(--line); }
.logo { display:flex; align-items:center; gap:10px; min-width:0; }
.logo-mark { width:38px; height:38px; border-radius:11px; object-fit:cover; border:1px solid rgba(255,255,255,.2); box-shadow:0 4px 18px rgba(139,92,246,.45); }
.brand-name { font-size:1.25rem; font-weight:800; letter-spacing:.3px; }
.brand-name span { background:linear-gradient(90deg,var(--a),var(--b)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.live-pill { display:flex; align-items:center; gap:6px; padding:5px 12px; border-radius:99px; font-size:.7rem; font-weight:700; letter-spacing:1px; color:#fecaca; background:rgba(239,68,68,.14); border:1px solid rgba(239,68,68,.4); }
.live-pill i, .dot { width:7px; height:7px; border-radius:50%; background:var(--live); box-shadow:0 0 0 0 rgba(239,68,68,.7); animation:pulse 1.6s infinite; flex-shrink:0; }
@keyframes pulse { 70% { box-shadow:0 0 0 7px rgba(239,68,68,0); } 100% { box-shadow:0 0 0 0 rgba(239,68,68,0); } }
.main-container { width:100%; max-width:980px; margin:0 auto; padding:16px 14px 30px; display:flex; flex-direction:column; gap:16px; }
.player-section { width:100%; }
.video-container { position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:18px; overflow:hidden; border:1px solid var(--line); box-shadow:0 0 0 1px rgba(34,211,238,.12),0 20px 60px -15px rgba(139,92,246,.45); }
.video-container iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
.video-container.willow-ios-mode { display:flex; align-items:center; justify-content:center; }
.video-container.willow-ios-mode iframe { width:100%; height:100%; object-fit:contain; }
.premium-banner-box { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 16px; border-radius:16px; background:linear-gradient(135deg,rgba(34,158,217,.18),rgba(139,92,246,.14)); border:1px solid rgba(34,158,217,.35); }
.banner-left { display:flex; flex-direction:column; min-width:0; flex:1; }
.banner-brand { font-weight:800; font-size:1rem; }
.banner-sub { font-size:.72rem; color:var(--mute); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.btn-telegram-banner { display:flex; align-items:center; gap:8px; padding:10px 18px; border-radius:99px; background:linear-gradient(135deg,#2AABEE,#229ED9); color:#fff; text-decoration:none; font-weight:700; font-size:.85rem; white-space:nowrap; flex-shrink:0; box-shadow:0 6px 20px rgba(34,158,217,.4); transition:.2s; }
.btn-telegram-banner:hover { transform:translateY(-1px); }
.btn-telegram-banner svg { width:18px; height:18px; fill:#fff; }
.section-title { font-size:.72rem; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--mute); margin-bottom:10px; }
.controls { width:100%; }
.btn-copy { width:100%; padding:12px; background:var(--card); border:1px dashed rgba(34,211,238,.4); color:var(--a); border-radius:12px; cursor:pointer; font-weight:600; font-size:.88rem; transition:.2s; }
.btn-copy:hover { background:rgba(34,211,238,.1); }
.groups .section-title { margin-top:18px; }
.groups .section-title:first-child { margin-top:0; }
.groups .channel-list { margin-bottom:0; }
.channel-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px; }
.channel-btn { display:flex; align-items:center; gap:12px; padding:14px; text-align:left; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:14px; cursor:pointer; font-family:inherit; transition:.2s; }
.channel-btn:hover { border-color:rgba(34,211,238,.5); transform:translateY(-2px); }
.channel-btn .ch-txt { display:flex; flex-direction:column; gap:2px; }
.channel-btn b { font-size:.92rem; }
.channel-btn small { color:var(--mute); font-size:.72rem; }
.channel-btn .dot { background:#475569; animation:none; }
.channel-btn.active { background:linear-gradient(135deg,rgba(34,211,238,.16),rgba(139,92,246,.18)); border-color:var(--a); box-shadow:0 8px 24px -10px rgba(34,211,238,.6); }
.channel-btn.active .dot { background:var(--live); animation:pulse 1.6s infinite; }
.share-mode-tg-btn { display:none; text-align:center; }
.btn-tg-share-large { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-width:240px; padding:12px 26px; border:0; border-radius:99px; cursor:pointer; color:#fff; font-weight:700; font-size:.9rem; background:linear-gradient(135deg,#2AABEE,#229ED9); box-shadow:0 6px 20px rgba(34,158,217,.4); transition:.2s; }
.btn-tg-share-large:hover { transform:translateY(-1px); }
.btn-tg-share-large svg { width:18px; height:18px; fill:#fff; }
body.share-mode .groups, body.share-mode .channel-list, body.share-mode .controls, body.share-mode .section-title { display:none !important; }
body.share-mode .share-mode-tg-btn { display:block; }
.popup-overlay { position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; padding:20px; background:rgba(3,6,14,.78); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
.popup-overlay.show { display:flex; }
.popup-box { width:100%; max-width:380px; text-align:center; padding:28px 22px 22px; border-radius:24px; background:linear-gradient(180deg,#111a2e,#0b1120); border:1px solid var(--line); box-shadow:0 30px 80px rgba(0,0,0,.6); animation:pop .35s ease; }
@keyframes pop { from { opacity:0; transform:translateY(14px) scale(.96); } }
.popup-icon-container { width:104px; height:104px; margin:0 auto 14px; border-radius:26px; overflow:hidden; border:2px solid rgba(34,158,217,.6); box-shadow:0 10px 34px rgba(34,158,217,.5); }
.popup-icon-container img { width:100%; height:100%; object-fit:cover; display:block; }
.popup-box h3 { font-size:1.3rem; font-weight:800; }
.popup-divider { width:44px; height:3px; border-radius:3px; margin:12px auto; background:linear-gradient(90deg,var(--a),var(--b)); }
.popup-box p { color:var(--mute); font-size:.88rem; line-height:1.55; margin-bottom:20px; }
.popup-actions { display:flex; flex-direction:column; gap:10px; }
.btn-action { display:block; padding:13px; border-radius:14px; border:0; font-family:inherit; font-size:.92rem; font-weight:700; text-decoration:none; color:#fff; cursor:pointer; transition:.2s; }
.btn-join { background:linear-gradient(135deg,#2AABEE,#229ED9); box-shadow:0 6px 20px rgba(34,158,217,.4); }
.btn-stream { background:var(--card); border:1px solid var(--line); color:var(--text); }
.btn-action:hover { transform:translateY(-1px); }
@media (max-width:480px) { .main-container { padding:12px 10px 24px; } .video-container { border-radius:14px; } .channel-list { grid-template-columns:1fr 1fr; } .channel-btn { padding:12px 10px; gap:9px; } .btn-telegram-banner { padding:9px 14px; } }
</style>
</head>

        let activeId = 'ss1_hd';
        const videoContainer = document.getElementById('videoContainer');

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('popup').classList.add('show');
            const params = new URLSearchParams(window.location.search);
            if(params.has('share')) {
                const targetId = params.get('share');
                if(channelMap[targetId]) {
                    document.body.classList.add('share-mode');
                    activeId = targetId;
                    applyWillowFix(activeId);
                    document.getElementById('player').src = channelMap[targetId];
                }
            }
        });

        function applyWillowFix(id) {
            if(id === 'willow_ios') {
                videoContainer.classList.add('willow-ios-mode');
            } else {
                videoContainer.classList.remove('willow-ios-mode');
            }
        }

        function hidePopup() { document.getElementById('popup').classList.remove('show'); }

        function loadCh(url, id, btn) {
            activeId = id;
            applyWillowFix(id);
            const player = document.getElementById('player');
            player.src = '';
            setTimeout(() => { player.src = url; }, 50);
            document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
        }

        function copyLink() {
            const cleanShareUrl = window.location.origin + window.location.pathname + '?share=' + activeId;
            navigator.clipboard.writeText(cleanShareUrl).then(() => { alert('Link copied: ' + cleanShareUrl); });
        }

        function shareToTelegramDirect() {
            const cleanShareUrl = window.location.origin + window.location.pathname + '?share=' + activeId;
            const shareText = "Watch Live Cricket Match Stream Here: " + cleanShareUrl;
            window.open("https://t.me/share/url?url=" + encodeURIComponent(cleanShareUrl) + "&text=" + encodeURIComponent("Watch Live Cricket Match Stream Here"), "_blank");
        }

        const lockOrientation = () => {
            if (document.fullscreenElement || document.webkitFullscreenElement || document.mozFullscreenElement) {
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock("landscape").catch(err => console.log("Orientation lock failed"));
                }
            } else {
                if (screen.orientation && screen.orientation.unlock) {
                    screen.orientation.unlock();
                }
            }
        };

        document.addEventListener("fullscreenchange", lockOrientation);
        document.addEventListener("webkitfullscreenchange", lockOrientation);
        document.addEventListener("mozfullscreenchange", lockOrientation);
